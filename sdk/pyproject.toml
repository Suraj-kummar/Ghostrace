[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrace"
version = "0.2.0"
description = "AI agent observability — session replay, cost tracking, loop detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ghostrace", email = "hello@ghostrace.dev" }]
keywords = ["ai", "agents", "observability", "tracing", "llm", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "anyio[trio]",
]
extended = [
    "langchain-core>=0.1",
    "langchain-openai>=0.1",
    "llama-index-core>=0.10",
    "google-generativeai>=0.5",
]

[project.urls]
Homepage = "https://ghostrace.dev"
Documentation = "https://docs.ghostrace.dev"
Repository = "https://github.com/ghostrace/ghostrace-python"
"Bug Tracker" = "https://github.com/ghostrace/ghostrace-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrace*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
